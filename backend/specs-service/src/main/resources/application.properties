quarkus.application.name=specs-service
quarkus.http.port=${QUARKUS_HTTP_PORT:8081}
quarkus.banner.enabled=false

# Sem chave a busca segue só com o 3D e a foto HD, com aviso (igual ao Node).
mobileapi.key=${MOBILEAPI_KEY:}
# Câmeras completas (traseiras + frontal) do aparelho escolhido: +2 créditos da cota por busca.
mobileapi.cameras-detalhadas=${MOBILEAPI_CAMERAS_DETALHADAS:true}
mobileapi.prazo-cameras=${MOBILEAPI_PRAZO_CAMERAS:12s}
# Preço de lançamento: GET /devices/{id}/misc/ do aparelho escolhido (nunca das sugestões), na mesma fila das câmeras.
mobileapi.preco=${MOBILEAPI_PRECO:true}
mobileapi.prazo-preco=${MOBILEAPI_PRAZO_PRECO:8s}
# Teto total das extras do aparelho escolhido (câmeras + preço), a partir do início delas; passa disso, fica null.
# Limita também MOBILEAPI_PRAZO_CAMERAS: com 15s, o valor 40s do lote não tem efeito.
mobileapi.prazo-extras=${MOBILEAPI_PRAZO_EXTRAS:15s}
# Cotação fixa para converter o preço de lançamento em reais (sem API de câmbio).
cotacao.usd-brl=${COTACAO_USD_BRL:5.40}
cotacao.eur-brl=${COTACAO_EUR_BRL:6.20}
cotacao.gbp-brl=${COTACAO_GBP_BRL:7.20}
cotacao.inr-brl=${COTACAO_INR_BRL:0.065}

# Segredo compartilhado com o core-api (header X-Internal-Token). Vazio = sem exigência (dev/compose).
specs.token=${SPECS_TOKEN:}

# Nada de containers automáticos em dev/test.
quarkus.devservices.enabled=false

# POST /eventos/celular-criado (chamado pelo core-api ao criar um celular): espera antes de repetir
# uma busca que falhou de forma temporária (rede/timeout/5xx).
eventos.espera-repeticao=2s

%test.mobileapi.key=chave-teste
%test.eventos.espera-repeticao=0s
