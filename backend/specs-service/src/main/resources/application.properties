quarkus.application.name=specs-service
quarkus.http.port=${QUARKUS_HTTP_PORT:8081}
quarkus.banner.enabled=false

# Sem chave a busca segue só com o 3D e a foto HD, com aviso (igual ao Node).
mobileapi.key=${MOBILEAPI_KEY:}
# Câmeras completas (traseiras + frontal) do aparelho escolhido: +2 créditos da cota por busca.
mobileapi.cameras-detalhadas=${MOBILEAPI_CAMERAS_DETALHADAS:true}
mobileapi.prazo-cameras=${MOBILEAPI_PRAZO_CAMERAS:12s}

# Nunca sobe Kafka/containers sozinho em dev/test: o broker vem do docker-compose.
quarkus.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# feedbackcell.celular.criado -> busca -> feedbackcell.celular.especificacoes
mp.messaging.incoming.celular-criado.connector=smallrye-kafka
mp.messaging.incoming.celular-criado.enabled=${KAFKA_ENABLED:true}
mp.messaging.incoming.celular-criado.topic=feedbackcell.celular.criado
mp.messaging.incoming.celular-criado.group.id=specs-service
mp.messaging.incoming.celular-criado.auto.offset.reset=earliest
mp.messaging.incoming.celular-criado.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.celular-criado.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# um evento ruim não para o consumo; a busca é só um preenchimento opcional. Falha temporária
# (rede/timeout/5xx) é repetida uma vez pelo ProcessadorCelularCriado antes de responder.
mp.messaging.incoming.celular-criado.failure-strategy=ignore
eventos.espera-repeticao=2s

mp.messaging.outgoing.celular-especificacoes.connector=smallrye-kafka
mp.messaging.outgoing.celular-especificacoes.enabled=${KAFKA_ENABLED:true}
mp.messaging.outgoing.celular-especificacoes.topic=feedbackcell.celular.especificacoes
mp.messaging.outgoing.celular-especificacoes.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.celular-especificacoes.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.celular-especificacoes.acks=all

# Testes: canais em memória, nada de rede.
%test.mp.messaging.incoming.celular-criado.connector=smallrye-in-memory
%test.mp.messaging.incoming.celular-criado.enabled=true
%test.mp.messaging.outgoing.celular-especificacoes.connector=smallrye-in-memory
%test.mp.messaging.outgoing.celular-especificacoes.enabled=true
%test.mobileapi.key=chave-teste
%test.eventos.espera-repeticao=0s
