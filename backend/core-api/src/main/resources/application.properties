# Em desenvolvimento local lê o .env da raiz do repositório (como o backend Node);
# no Docker as variáveis chegam pelo env_file do compose.
spring.config.import=optional:file:${APP_ENV_FILE:../../.env}[.properties]
spring.application.name=core-api

server.port=${PORT:8080}
server.shutdown=graceful
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false

# Cada requisição numa virtual thread: espera de I/O (MySQL, Redis, specs-service) não prende
# threads do Tomcat, então uma busca lenta de especificações não enfileira o resto da API.
spring.threads.virtual.enabled=true

# MySQL com sessão em UTC (datas serializadas como no antigo backend Node).
# DB_NAME padrão igual ao .env.example e ao CI (feedbackcell_db).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:feedbackcell_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# O pool em si não exige o banco no startup (com FLYWAY_ENABLED=false o app sobe sem MySQL e o
# /readyz reporta). Com o Flyway ligado (padrão) o startup PRECISA do banco: o Flyway tenta conectar
# FLYWAY_CONNECT_RETRIES vezes (espera crescente, até ~10 s entre tentativas) e, se não conseguir ou
# a migração falhar, o processo encerra com erro. É proposital: nunca atender com schema desatualizado.
# No compose isso é coberto por depends_on (mysql healthy) + restart.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
# Connector/J: prepared statements no servidor com cache por conexão e menos idas ao banco
# por comando (estado da sessão e autocommit controlados localmente).
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# Schema versionado (src/main/resources/db/migration). V1 = schema final que o backend Node criava
# (feedbackcell.sql + migrações). Banco já existente sem tabela flyway_schema_history (criado pelo
# Node, já com as migrações dele aplicadas) recebe baseline na versão 1 sem executar o V1.
# Várias réplicas podem subir juntas: o Flyway serializa a migração com um lock do MySQL (GET_LOCK).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}

app.env=${APP_ENV:development}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:24h}
app.bcrypt-rounds=${BCRYPT_ROUNDS:10}
app.cors-origin=${CORS_ORIGIN:http://localhost:3000}
app.admin-user-ids=${ADMIN_USER_IDS:}
app.trust-proxy=${TRUST_PROXY:1}
app.rate-limit.limit=${RATE_LIMIT:100}
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}
app.rate-limit.redis-url=${RATE_LIMIT_REDIS_URL:}
# Ao criar um celular sem especificações/3D, pede a busca ao specs-service em segundo plano.
app.busca-automatica=${BUSCA_AUTOMATICA:true}
app.specs-service-url=${SPECS_SERVICE_URL:http://specs-service:8081}
