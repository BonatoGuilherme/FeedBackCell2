# Em desenvolvimento local lê o .env da raiz do repositório (como o backend Node);
# no Docker as variáveis chegam pelo env_file do compose.
spring.config.import=optional:file:${APP_ENV_FILE:../../.env}[.properties]
spring.application.name=core-api

server.port=${PORT:8080}
server.shutdown=graceful
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false

# Kafka é configurado à mão (KafkaConfig) para poder ser desligado com KAFKA_ENABLED=false.
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

# MySQL compartilhado com o backend Node: mesmo schema, sessão em UTC (igual ao container Node).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:feedbackcell}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# Sobe mesmo com o banco fora do ar (o /readyz reporta); igual ao pool preguiçoso do mysql2.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

app.env=${APP_ENV:development}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:24h}
app.bcrypt-rounds=${BCRYPT_ROUNDS:10}
app.cors-origin=${CORS_ORIGIN:http://localhost:3000}
app.admin-user-ids=${ADMIN_USER_IDS:}
app.trust-proxy=${TRUST_PROXY:1}
app.rate-limit.limit=${RATE_LIMIT:100}
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}
app.rate-limit.redis-url=${RATE_LIMIT_REDIS_URL:}
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
app.specs-service-url=${SPECS_SERVICE_URL:http://specs-service:8081}
