# Stack de produção. Só o proxy publica porta no host; MySQL, Redis, core-api,
# specs-service e frontend ficam na rede interna. Para desenvolvimento (MySQL/Redis
# acessíveis em 127.0.0.1) some o arquivo de dev:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Segredos obrigatórios (DB_*, JWT_SECRET) são validados na interpolação: o compose
# recusa subir se faltarem no .env.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# .env é opcional para o compose carregar (a CI valida sem ele); as variáveis
# obrigatórias são exigidas com ${VAR:?} abaixo.
x-env-file: &default-env-file
  - path: .env
    required: false

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:?defina DB_NAME no .env}
    # O schema é aplicado pelo core-api (Flyway) no startup.
    command: ["--max-connections=${DB_MAX_CONNECTIONS:-151}"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - feedbackcell-network
    healthcheck:
      # TCP (127.0.0.1), não socket: durante o init o servidor temporário roda sem rede
      # e o ping por socket marcaria "healthy" cedo demais.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPUS:-1.0}"
          memory: ${MYSQL_MEM_LIMIT:-1g}
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Só contadores do rate limit: sem persistência e com teto de memória.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

  # API pública (Spring Boot). Aplica o schema com Flyway no startup.
  core-api:
    build:
      context: ./backend/core-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: *default-env-file
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      DB_NAME: ${DB_NAME:?defina DB_NAME no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-1}
      BUSCA_AUTOMATICA: ${BUSCA_AUTOMATICA:-true}
      SPECS_SERVICE_URL: http://specs-service:8081
      # Domínio público do frontend (ex.: https://feedbackcell.com.br). Vazio = http://localhost:3000.
      # Pelo proxy o frontend e a API têm a mesma origem; CORS só importa com a API em outro domínio.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # inclui a primeira execução das migrações Flyway
      start_period: 60s
    deploy:
      resources:
        limits:
          # por réplica (-XX:MaxRAMPercentage=75 dimensiona o heap a partir daqui)
          cpus: "${CORE_API_CPUS:-1.0}"
          memory: ${CORE_API_MEM_LIMIT:-768m}
    logging: *default-logging

  # Serviço interno de especificações: não publica portas nem passa pelo proxy.
  specs-service:
    build:
      context: ./backend/specs-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: 8081
      MOBILEAPI_KEY: ${MOBILEAPI_KEY:-}
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${SPECS_SERVICE_CPUS:-0.5}"
          memory: ${SPECS_SERVICE_MEM_LIMIT:-512m}
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # No Docker o navegador fala com a API pelo proxy (/api). Fora do Docker o
        # frontend usa http://localhost:8080; DOCKER_API_URL troca o valor aqui.
        NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
    environment:
      NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-1.0}"
          memory: ${FRONTEND_MEM_LIMIT:-512m}
    logging: *default-logging

  # Única porta publicada no host. Só HTTP aqui: para HTTPS no próprio nginx, some
  # docker-compose.https.yml (Let's Encrypt); ou termine TLS num proxy/load balancer na frente.
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:80"
    volumes:
      # pelo diretório de templates (e não direto no conf.d) para o override HTTPS trocar o arquivo
      - ./infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/feedbackcell-locations.conf:/etc/nginx/snippets/feedbackcell-locations.conf:ro
    depends_on:
      core-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging: *default-logging

  backup:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    # Só o necessário para o dump (sem env_file: o JWT_SECRET não entra aqui).
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_NAME: ${DB_NAME:?defina DB_NAME no .env}
      MYSQL_PWD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mysql_backups:/backups
    networks:
      - feedbackcell-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

networks:
  feedbackcell-network:
    driver: bridge

volumes:
  mysql_data:
    name: feedbackcellnextjs_mysql_data
  mysql_backups:
    name: feedbackcellnextjs_mysql_backups
