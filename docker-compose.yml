services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
    command: ["--max-connections=${DB_MAX_CONNECTIONS:-151}"]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/feedbackcell.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      # Um broker KRaft (broker + controller no mesmo processo), sem ZooKeeper.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Tópicos são criados explicitamente pelo kafka-init.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-init:
    image: apache/kafka:4.0.0
    restart: "no"
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topico in feedbackcell.celular.criado feedbackcell.celular.especificacoes; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists             --topic "$$topico" --partitions "$$KAFKA_TOPIC_PARTITIONS" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - feedbackcell-network

  # Migrações idempotentes do schema (script Node), executadas uma única vez antes das APIs
  # para evitar que várias réplicas alterem o schema ao mesmo tempo. Usado pelo core-api e pelo legado.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
    command: ["node", "db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - feedbackcell-network

  # Backend Node legado (referência de comportamento). Sobe só com `--profile legacy`
  # e não é exposto pelo proxy; use-o para comparar respostas com o core-api.
  backend:
    profiles: ["legacy"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  core-api:
    build:
      context: ./backend-java/core-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-1}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPECS_SERVICE_URL: http://specs-service:8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Serviço interno de especificações: não publica portas nem passa pelo proxy.
  specs-service:
    build:
      context: ./backend-java/specs-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: 8081
      MOBILEAPI_KEY: ${MOBILEAPI_KEY:-}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # No Docker o navegador fala com a API pelo proxy (/api). O NEXT_PUBLIC_API_URL
        # do .env (localhost:5000) é para rodar fora do Docker; use DOCKER_API_URL para trocar aqui.
        NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
    environment:
      NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mysql_backups:/backups
    networks:
      - feedbackcell-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  feedbackcell-network:
    driver: bridge

volumes:
  mysql_data:
    name: feedbackcellnextjs_mysql_data
  mysql_backups:
    name: feedbackcellnextjs_mysql_backups
  kafka_data:
    name: feedbackcellnextjs_kafka_data
