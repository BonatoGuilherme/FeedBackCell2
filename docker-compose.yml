# Stack de produção. Só o proxy publica porta no host; MySQL, Redis, Kafka, core-api,
# specs-service e frontend ficam na rede interna. Para desenvolvimento (MySQL/Redis/Kafka
# acessíveis em 127.0.0.1) some o arquivo de dev:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Segredos obrigatórios (DB_*, JWT_SECRET) são validados na interpolação: o compose
# recusa subir se faltarem no .env.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# .env é opcional para o compose carregar (a CI valida sem ele); as variáveis
# obrigatórias são exigidas com ${VAR:?} abaixo.
x-env-file: &default-env-file
  - path: .env
    required: false

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:?defina DB_NAME no .env}
    # O schema é aplicado pelo core-api (Flyway) no startup.
    command: ["--max-connections=${DB_MAX_CONNECTIONS:-151}"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - feedbackcell-network
    healthcheck:
      # TCP (127.0.0.1), não socket: durante o init o servidor temporário roda sem rede
      # e o ping por socket marcaria "healthy" cedo demais.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPUS:-1.0}"
          memory: ${MYSQL_MEM_LIMIT:-1g}
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Só contadores do rate limit: sem persistência e com teto de memória.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      # Um broker KRaft (broker + controller no mesmo processo), sem ZooKeeper.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Tópicos são criados explicitamente pelo kafka-init.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${KAFKA_CPUS:-1.0}"
          # heap (KAFKA_HEAP_OPTS) + page cache/metaspace; mantenha acima do -Xmx
          memory: ${KAFKA_MEM_LIMIT:-1g}
    logging: *default-logging

  kafka-init:
    image: apache/kafka:4.0.0
    restart: "no"
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_HEAP_OPTS: -Xmx256m
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topico in feedbackcell.celular.criado feedbackcell.celular.especificacoes; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topico" --partitions "$$KAFKA_TOPIC_PARTITIONS" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - feedbackcell-network
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

  # API pública (Spring Boot). Aplica o schema com Flyway no startup.
  core-api:
    build:
      context: ./backend-java/core-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: *default-env-file
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      DB_NAME: ${DB_NAME:?defina DB_NAME no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-1}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPECS_SERVICE_URL: http://specs-service:8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # inclui a primeira execução das migrações Flyway
      start_period: 90s
    deploy:
      resources:
        limits:
          # por réplica (-XX:MaxRAMPercentage=75 dimensiona o heap a partir daqui)
          cpus: "${CORE_API_CPUS:-1.0}"
          memory: ${CORE_API_MEM_LIMIT:-768m}
    logging: *default-logging

  # Serviço interno de especificações: não publica portas nem passa pelo proxy.
  specs-service:
    build:
      context: ./backend-java/specs-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: 8081
      MOBILEAPI_KEY: ${MOBILEAPI_KEY:-}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${SPECS_SERVICE_CPUS:-0.5}"
          memory: ${SPECS_SERVICE_MEM_LIMIT:-512m}
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # No Docker o navegador fala com a API pelo proxy (/api). Fora do Docker o
        # frontend usa http://localhost:8080; DOCKER_API_URL troca o valor aqui.
        NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
    environment:
      NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-1.0}"
          memory: ${FRONTEND_MEM_LIMIT:-512m}
    logging: *default-logging

  # Única porta publicada no host. Termine TLS num proxy/load balancer na frente dele.
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging: *default-logging

  backup:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    # Só o necessário para o dump (sem env_file: o JWT_SECRET não entra aqui).
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_NAME: ${DB_NAME:?defina DB_NAME no .env}
      MYSQL_PWD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mysql_backups:/backups
    networks:
      - feedbackcell-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

networks:
  feedbackcell-network:
    driver: bridge

volumes:
  mysql_data:
    name: feedbackcellnextjs_mysql_data
  mysql_backups:
    name: feedbackcellnextjs_mysql_backups
  kafka_data:
    name: feedbackcellnextjs_kafka_data
