services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
    command: ["--max-connections=${DB_MAX_CONNECTIONS:-151}"]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/feedbackcell.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
    command: ["node", "db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - feedbackcell-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # No Docker o navegador fala com a API pelo proxy (/api). O NEXT_PUBLIC_API_URL
        # do .env (localhost:5000) é para rodar fora do Docker; use DOCKER_API_URL para trocar aqui.
        NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
    environment:
      NEXT_PUBLIC_API_URL: ${DOCKER_API_URL:-/api}
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - feedbackcell-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mysql_backups:/backups
    networks:
      - feedbackcell-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  feedbackcell-network:
    driver: bridge

volumes:
  mysql_data:
    name: feedbackcellnextjs_mysql_data
  mysql_backups:
    name: feedbackcellnextjs_mysql_backups
