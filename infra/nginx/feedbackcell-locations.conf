# Rotas do FeedBackCELL, incluídas pelo server HTTP (default.conf) e pelo HTTPS
# (https.conf.template). Fica em /etc/nginx/snippets, fora do conf.d, para não ser
# carregado sozinho no contexto http.

# cache da vitrine (map $fbc_cache_control no arquivo do server); vazio fora de
# /phones/, e o nginx não envia cabeçalho com valor vazio
add_header Cache-Control $fbc_cache_control always;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# O core-api espera até 30 s pela busca de especificações; deixa margem acima disso.
proxy_read_timeout 60s;

location = /health {
    proxy_pass http://feedbackcell_core_api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /readyz {
    proxy_pass http://feedbackcell_core_api/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api {
    return 308 /api/;
}

location /api/ {
    # fotos dos celulares: até 5 MB cada (margem para o cabeçalho)
    client_max_body_size 6m;
    proxy_pass http://feedbackcell_core_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /phones/ {
    # troca o "max-age=0" do Next pelo cache definido no map
    proxy_hide_header Cache-Control;
    proxy_pass http://feedbackcell_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://feedbackcell_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
