resolver 127.0.0.11 valid=10s ipv6=off;

# Não expõe a versão do nginx em headers nem em páginas de erro.
server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml application/manifest+json;

# API pública: core-api (Spring Boot). O specs-service é interno e não é exposto aqui.
upstream feedbackcell_core_api {
    zone feedbackcell_core_api 64k;
    server core-api:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream feedbackcell_frontend {
    zone feedbackcell_frontend 64k;
    server frontend:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Headers de segurança básicos. "always" inclui respostas de erro.
    # (add_header num location substitui os do server; por isso nenhum location define add_header.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS só faz sentido sobre HTTPS: ative no proxy/load balancer que termina TLS.

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # O core-api espera até 30 s pela busca de especificações; deixa margem acima disso.
    proxy_read_timeout 60s;

    location = /health {
        proxy_pass http://feedbackcell_core_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://feedbackcell_core_api/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # fotos dos celulares: até 5 MB cada (margem para o cabeçalho)
        client_max_body_size 6m;
        proxy_pass http://feedbackcell_core_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://feedbackcell_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
