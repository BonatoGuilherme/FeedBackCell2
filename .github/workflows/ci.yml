name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo branch/PR cancela o run anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  core-api:
    name: core-api (Spring Boot) verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/core-api/pom.xml
      - run: chmod +x mvnw
        working-directory: backend/core-api
      - run: ./mvnw -B verify
        working-directory: backend/core-api

  specs-service:
    name: specs-service (Quarkus) verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/specs-service/pom.xml
      - run: chmod +x mvnw
        working-directory: backend/specs-service
      - run: ./mvnw -B verify
        working-directory: backend/specs-service

  compose:
    name: Docker Compose config and image build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Valores descartáveis só para a interpolação do compose; não são segredos reais.
    env:
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_NAME: feedbackcell_db
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          DOMAIN=ci.example.com docker compose -f docker-compose.yml -f docker-compose.https.yml config -q
      - name: Only the proxy publishes ports in production
        run: |
          published="$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.ports != null) | .key')"
          echo "services with published ports: $published"
          test "$published" = "proxy"
      - name: Validate nginx config (HTTP)
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/infra/nginx/feedbackcell-locations.conf:/etc/nginx/snippets/feedbackcell-locations.conf:ro" \
            --add-host core-api:127.0.0.1 --add-host frontend:127.0.0.1 \
            nginx:1.28-alpine /bin/sh -c '/docker-entrypoint.sh nginx -t'
      - name: Validate nginx config (HTTPS, certificado autoassinado)
        run: |
          docker run --rm -e DOMAIN=ci.example.com -e 'NGINX_ENVSUBST_FILTER=^DOMAIN$' \
            -v "$PWD/infra/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/infra/nginx/feedbackcell-locations.conf:/etc/nginx/snippets/feedbackcell-locations.conf:ro" \
            --add-host core-api:127.0.0.1 --add-host frontend:127.0.0.1 \
            nginx:1.28-alpine /bin/sh -c '
              apk add -q openssl >/dev/null
              d=/etc/letsencrypt/live/ci.example.com && mkdir -p "$d"
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=ci.example.com \
                -keyout "$d/privkey.pem" -out "$d/fullchain.pem" 2>/dev/null
              /docker-entrypoint.sh nginx -t'
      - name: Lint backup script
        run: sh -n infra/backup/backup.sh
      - name: Build images
        run: docker compose build
