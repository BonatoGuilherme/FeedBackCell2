name: CI

# Cada commit roda uma vez só:
# - branch de feature: pelo PR para a dev;
# - dev e master: pelo push. O PR de release (dev -> master) mostra os
#   checks desse push, porque é o mesmo commit.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Um push novo no mesmo branch/PR cancela o run anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  core-api:
    name: core-api (Spring Boot) verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/core-api/pom.xml
      # o cache do setup-java guarda só ~/.m2/repository; o Maven que o mvnw baixa
      # fica em ~/.m2/wrapper e, sem isto, vinha do Maven Central a cada run
      - uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ runner.os }}-${{ hashFiles('backend/core-api/.mvn/wrapper/maven-wrapper.properties') }}
      - run: chmod +x mvnw
        working-directory: backend/core-api
      - run: ./mvnw -B verify
        working-directory: backend/core-api

  specs-service:
    name: specs-service (Quarkus) verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/specs-service/pom.xml
      - uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ runner.os }}-${{ hashFiles('backend/specs-service/.mvn/wrapper/maven-wrapper.properties') }}
      - run: chmod +x mvnw
        working-directory: backend/specs-service
      - run: ./mvnw -B verify
        working-directory: backend/specs-service

  compose:
    name: Docker Compose config and image build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Valores descartáveis só para a interpolação do compose; não são segredos reais.
    env:
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_NAME: feedbackcell_db
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-chars
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          DOMAIN=ci.example.com docker compose -f docker-compose.yml -f docker-compose.https.yml config -q
      - name: Only the proxy publishes ports in production
        run: |
          published="$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.ports != null) | .key')"
          echo "services with published ports: $published"
          test "$published" = "proxy"
      - name: Validate nginx config (HTTP)
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/infra/nginx/feedbackcell-locations.conf:/etc/nginx/snippets/feedbackcell-locations.conf:ro" \
            --add-host core-api:127.0.0.1 --add-host frontend:127.0.0.1 \
            nginx:1.28-alpine /bin/sh -c '/docker-entrypoint.sh nginx -t'
      - name: Validate nginx config (HTTPS, certificado autoassinado)
        run: |
          docker run --rm -e DOMAIN=ci.example.com -e 'NGINX_ENVSUBST_FILTER=^DOMAIN$' \
            -v "$PWD/infra/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/infra/nginx/feedbackcell-locations.conf:/etc/nginx/snippets/feedbackcell-locations.conf:ro" \
            --add-host core-api:127.0.0.1 --add-host frontend:127.0.0.1 \
            nginx:1.28-alpine /bin/sh -c '
              apk add -q openssl >/dev/null
              d=/etc/letsencrypt/live/ci.example.com && mkdir -p "$d"
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=ci.example.com \
                -keyout "$d/privkey.pem" -out "$d/fullchain.pem" 2>/dev/null
              /docker-entrypoint.sh nginx -t'
      - name: Lint shell scripts
        run: |
          sh -n infra/backup/backup.sh
          bash -n scripts/deploy.sh
      - uses: docker/setup-buildx-action@v4
      # Mesmo build do "docker compose build", com as camadas guardadas no cache
      # do GitHub Actions: Maven, dependências e pnpm só são baixados de novo
      # quando o pom.xml ou o lockfile mudam.
      - name: Build images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-compose.yml
          set: |
            core-api.cache-from=type=gha,scope=core-api
            core-api.cache-to=type=gha,scope=core-api,mode=max
            specs-service.cache-from=type=gha,scope=specs-service
            specs-service.cache-to=type=gha,scope=specs-service,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            backup.cache-from=type=gha,scope=backup
            backup.cache-to=type=gha,scope=backup,mode=max
